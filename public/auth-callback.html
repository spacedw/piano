<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciando sesión… — PianoApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0A0B;
      color: #F4F1EA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .logo {
      font-size: 40px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 300;
      margin-bottom: 8px;
      color: #F4F1EA;
    }
    p {
      font-size: 14px;
      color: #908C84;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: rgba(201, 169, 110, 0.15);
      border: 1px solid rgba(201, 169, 110, 0.35);
      border-radius: 12px;
      color: #C9A96E;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: rgba(201, 169, 110, 0.25); }
    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(201,169,110,0.2);
      border-top-color: #C9A96E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">🎹</div>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Completando sesión…</h1>
  <p id="desc">Un momento, estamos verificando tu cuenta.</p>
  <a class="btn" id="openBtn" href="https://pianoapp.uiai.dev" style="display:none">
    🎹 Abrir PianoApp
  </a>

  <script>
    // Supabase pone el token en el hash: #access_token=...&refresh_token=...
    // Lo pasamos como query params a la app principal para que el SDK lo procese
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    const APP_URL = 'https://pianoapp.uiai.dev';

    if (accessToken) {
      // Redirigir automáticamente pasando el hash a la app
      const dest = `${APP_URL}/#${hash}`;
      
      // Intentar redirigir inmediatamente
      window.location.replace(dest);

      // Si no redirigió en 1.5s (PWA bloqueó), mostrar botón
      setTimeout(() => {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = '¡Sesión iniciada!';
        document.getElementById('desc').textContent = 'Pulsa el botón para volver a la app.';
        const btn = document.getElementById('openBtn');
        btn.href = dest;
        btn.style.display = 'inline-flex';
      }, 1500);
    } else {
      // Sin token — puede ser un error o ya está autenticado
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Volviendo a la app…';
      document.getElementById('desc').textContent = '';
      setTimeout(() => window.location.replace(APP_URL), 800);
    }
  </script>
</body>
</html>
